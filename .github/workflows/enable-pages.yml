name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on Pages for main /
        uses: actions/github-script@v7
        with:
          script: |
            const opts = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: "legacy",
              source: { branch: "main", path: "/" },
            };
            try {
              const created = await github.rest.repos.createPagesSite(opts);
              core.info(`Pages created: ${created.data.html_url}`);
            } catch (error) {
              if (error.status === 409) {
                const updated = await github.rest.repos.updatePagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  build_type: "legacy",
                  source: { branch: "main", path: "/" },
                });
                core.info(`Pages updated: ${updated.data.html_url}`);
                return;
              }
              core.setFailed(error.message || String(error));
            }
